<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090C12"><meta name="robots" content="noindex,nofollow"><style>html{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>window.QDSS_REMOTE = {"url": "data.bin"};</script></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>QDSS Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a trading terminal built from LAYERS you can stack. Wide screens: top bar with the layer chips, then watchlist | big chart | signal
   panel. Phones: the same parts stacked, chart first. One deliberate dark look (a chart desk at night); every colour is a token. */
:root {
  --bg: #090C12; --panel: #0F141D; --panel-2: #151B27; --raise: #1B2332; --line: #222C3D; --ink: #E7ECF5; --muted: #8A96AD; --faint: #5C6880;
  --accent: #5B8CFF; --buy: #1FBF8F; --sell: #F0506E; --up: #3D8BFF; --down: #FF9A2E; --dial: #B48CFF; --warn: #FFB84D; --on-solid: #071018;
  --gold: #F5C451;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.muted { color: var(--muted) } .small { font-size: 12.5px } p { margin: 0 }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); margin: 0 0 8px; font-weight: 600 }
.pos { color: var(--buy) } .neg { color: var(--sell) }

/* ── shell ── */
.app { display: grid; grid-template-columns: 312px minmax(0, 1fr) 404px; grid-template-rows: auto minmax(0, 1fr); height: 100%; gap: 1px; background: var(--line) }
.top { grid-column: 1 / -1; background: var(--panel); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { display: flex; align-items: center; gap: 9px; font: 700 17px var(--display); letter-spacing: -0.01em }
.brand svg { display: block }
.layers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; align-items: center }
.layers::-webkit-scrollbar { display: none }
.lay { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 12.5px; color: var(--muted); letter-spacing: 0.02em }
.lay .tick { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--faint); display: grid; place-items: center; font-size: 11px; line-height: 1; color: transparent }
.lay[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 20%, var(--bg)); border-color: var(--accent); color: var(--ink) }
.lay[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-solid) }
.lay.sysb { padding-left: 12px } .lay.sysb[aria-pressed="true"] { background: var(--accent); color: var(--on-solid) }
.lay .n { font: 700 11px var(--display); padding: 1px 6px; border-radius: 999px; background: var(--raise); color: var(--muted) }
.lay .n.A { background: color-mix(in srgb, var(--gold) 26%, transparent); color: var(--gold) } .lay .n.B { background: color-mix(in srgb, var(--buy) 22%, transparent); color: var(--buy) }
.lay .dotp { width: 8px; height: 8px; border-radius: 50%; background: var(--buy) } .lay .dotp.s { background: var(--sell) } .lay .dotp.up { background: var(--up) } .lay .dotp.dn { background: var(--down) }
.sep { flex: 0 0 1px; align-self: stretch; background: var(--line); margin: 4px 4px }
.status { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 7px; white-space: nowrap; justify-self: end }
.status.stale { color: var(--warn) }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block }
.livedot.on { background: var(--buy); box-shadow: 0 0 0 4px color-mix(in srgb, var(--buy) 22%, transparent) }
.symbol { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap }
.symbol .name { font: 700 26px var(--display); letter-spacing: -0.02em }
.symbol .sub { color: var(--muted); font-size: 13px }
.symbol .live { font: 600 26px var(--display) }
.symbol .chg { font-weight: 600; font-size: 13px }

/* ── watchlist ── */
.watch { background: var(--panel); overflow-y: auto; padding: 12px 10px 16px; min-height: 0 }
.whead, .wrow { display: grid; grid-template-columns: 50px minmax(56px, 1fr) auto; align-items: center; gap: 8px }
.whead { padding: 0 6px 6px; color: var(--faint); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase }
.whead .tfl, .wsq { display: grid; grid-auto-flow: column; grid-auto-columns: 21px; gap: 3px; justify-content: end }
.whead .tfl span { text-align: center; letter-spacing: 0; font-size: 9.5px }
.wrow { padding: 5px 6px; border-radius: 9px }
.wrow[data-on="true"] { background: var(--raise); box-shadow: inset 2px 0 0 var(--accent) }
.wmain { display: contents; text-align: left }
.wmain .sym { font: 700 14px var(--display) } .wmain .px { color: var(--muted); font-size: 12.5px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sq { width: 21px; height: 21px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--faint) }
.sq[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px }
.sq.none { background: transparent; border-style: dashed; opacity: 0.5 } .sq.gap { visibility: hidden }
.sq.long { background: var(--buy); border-color: var(--buy); color: var(--on-solid) } .sq.short { background: var(--sell); border-color: var(--sell); color: var(--on-solid) }
.sq.called-long { border: 2px solid var(--buy); color: var(--buy) } .sq.called-short { border: 2px solid var(--sell); color: var(--sell) }
.sq.b2 { border-color: var(--buy); color: var(--buy) } .sq.s2 { border-color: var(--sell); color: var(--sell) }
.sq.gA { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--panel-2)) } .sq.gB { border-color: var(--buy); color: var(--buy) }
.wkey { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 12px 6px 0; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--line); margin-top: 12px }
.wkey span { display: inline-flex; align-items: center; gap: 5px } .wkey .sq { width: 14px; height: 14px; border-radius: 4px; font-size: 0 }

/* ── stage: toolbar, chart ── */
.stage { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap }
.tfb { padding: 6px 11px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted) }
.tfb[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent) }
.tool { margin-left: auto; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600 }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 11.5px; white-space: nowrap; color: var(--on-solid) }
.pill.buy { background: var(--buy) } .pill.sell { background: var(--sell) } .pill.up { background: var(--up) } .pill.down { background: var(--down) } .pill.idle { background: var(--faint); color: var(--ink) }
.pill.A { background: var(--gold) } .pill.B { background: var(--buy) }
.pill.line { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600 }
.chartbox { position: relative; flex: 1; min-height: 0 }
#lw { position: absolute; inset: 0 }
#lw.in { animation: fade .35s ease both }
.ohlc { position: absolute; left: 12px; top: 8px; z-index: 3; font-size: 12px; color: var(--muted); pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 90px) }
.ohlc b { color: var(--ink); font-weight: 600 }
.pmask { position: absolute; right: 0; bottom: 26px; width: 60px; z-index: 2; background: var(--bg); border-left: 1px solid var(--line); pointer-events: none }
.psep { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); z-index: 2; pointer-events: none }
.plabel { position: absolute; left: 12px; z-index: 3; font-size: 11px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--bg) 78%, transparent); padding: 1px 6px; border-radius: 5px; max-width: calc(100% - 90px) }
.plabel b { color: var(--ink); font-weight: 600 }
.nochart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center }
.keyline { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 7px 12px; color: var(--muted); font-size: 11.5px; background: var(--panel); border-top: 1px solid var(--line) }
.keyline span { display: inline-flex; align-items: center; gap: 5px }
.sw { display: inline-block; width: 18px; height: 8px; border-radius: 3px }

/* ── right panel ── */
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0 }
.ptabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none }
.ptabs::-webkit-scrollbar { display: none }
.ptabs button { padding: 8px 9px 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap }
.ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.ptabs .badge { background: var(--sell); color: #fff; border-radius: 999px; font-size: 10px; padding: 1px 6px; margin-left: 5px }
.pbody { padding: 14px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px }
.pbody > * { animation: rise .4s cubic-bezier(.2, .7, .2, 1) both }
.pbody > *:nth-child(2) { animation-delay: .05s } .pbody > *:nth-child(3) { animation-delay: .1s } .pbody > *:nth-child(4) { animation-delay: .15s } .pbody > *:nth-child(n+5) { animation-delay: .2s }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0 }
.why { font-size: 15px; line-height: 1.5 }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px 12px }
.kv div { min-width: 0 } .kv b { display: block; font: 600 15px var(--display) } .kv span { font-size: 11.5px; color: var(--muted) }
.rowline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.setup { display: flex; flex-direction: column; gap: 8px }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px }
details p { margin-top: 6px; font-size: 12.5px; color: var(--muted) }
.how summary { font-size: 13px }
.how ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 7px; font-size: 13px; color: var(--muted) }
.how ol b { color: var(--ink); font-weight: 600 }

/* the signal card: one word tells you what the selected layers say right now */
.sig { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; border-radius: 14px; padding: 14px; border: 1px solid var(--line); background: linear-gradient(140deg, var(--raise), var(--panel-2)) }
.sig.buy { border-color: color-mix(in srgb, var(--buy) 55%, var(--line)); background: linear-gradient(140deg, color-mix(in srgb, var(--buy) 20%, var(--panel-2)), var(--panel-2)) }
.sig.sell { border-color: color-mix(in srgb, var(--sell) 55%, var(--line)); background: linear-gradient(140deg, color-mix(in srgb, var(--sell) 20%, var(--panel-2)), var(--panel-2)) }
.sig.live { animation: glow 1.8s ease-in-out infinite }
.ring { position: relative; width: 92px; height: 92px }
.ring svg { transform: rotate(-90deg); display: block }
.ring circle { fill: none; stroke-width: 9 } .ring .tr { stroke: var(--line) } .ring .fg { stroke: var(--buy); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .7, .2, 1) }
.ring.A .fg { stroke: var(--gold) } .ring.low .fg { stroke: var(--warn) } .ring.off .fg { stroke: var(--faint) }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 700 24px/1 var(--display) }
.ring .num small { display: block; font: 500 9.5px var(--body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 3px }
.sig .word { font: 700 30px/1.05 var(--display); letter-spacing: -0.02em }
.sig.buy .word { color: var(--buy) } .sig.sell .word { color: var(--sell) }
.sig .sub { color: var(--muted); font-size: 13px; margin-top: 6px }
.sig .verdict { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }

/* the members of a stack, and the other stacks you could pick */
.mem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.mem:first-of-type { border-top: 0 }
.mem .nm { font-weight: 600 } .mem .st { font-size: 12px; color: var(--muted) }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; text-align: left }
.srow:first-of-type { border-top: 0 }
.srow .nm { font-weight: 600; font-size: 13px } .srow .wr { font: 600 13px var(--display); color: var(--muted); min-width: 40px; text-align: right }
.srow[aria-current="true"] .nm { color: var(--accent) }

/* trade plans: the three risk levels, the exact prices, the profit picture */
.tiers { display: inline-flex; gap: 2px; margin-left: 10px; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg) }
.tierb { padding: 5px 10px; border-radius: 7px; font-weight: 700; font-size: 12px; color: var(--muted); letter-spacing: 0.03em }
.tierb[aria-pressed="true"] { background: var(--accent); color: var(--on-solid) }
.px3 { display: grid; gap: 8px; margin-bottom: 10px }
.pxr { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line) }
.pxr .k { font: 700 11px var(--body); letter-spacing: 0.08em; color: var(--muted) } .pxr .v { font: 700 20px var(--display) } .pxr .d { font-weight: 600; font-size: 13px }
.pxr.b { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)) } .pxr.t { border-color: color-mix(in srgb, var(--buy) 55%, var(--line)) } .pxr.s { border-color: color-mix(in srgb, var(--sell) 55%, var(--line)) }
.pxr.t .k, .pxr.t .d { color: var(--buy) } .pxr.s .k, .pxr.s .d { color: var(--sell) } .pxr .v.txt { font: 500 13px var(--body); color: var(--muted) }
.grow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; margin-bottom: 8px }
.grow b { display: block; font: 700 22px var(--display) } .grow span { font-size: 11.5px; color: var(--muted) } .grow .vs { color: var(--faint); font-size: 12px }
.spark { width: 100%; height: 74px; display: block; margin: 6px 0 4px } .spark path { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke } .spark .p { stroke: var(--gold) } .spark .h { stroke: var(--faint); stroke-dasharray: 4 3 }
.lvh, .lvl { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; width: 100%; text-align: right }
.lvh { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 10px 4px }
.lvl { padding: 10px; border-radius: 10px; border: 1px solid var(--line); margin-top: 6px; font: 600 14px var(--display) }
.lvl .nm { text-align: left; font: 700 13px var(--body); display: inline-flex; align-items: center; gap: 6px }
.lvl[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent) }
.okdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block }
table.st { width: 100%; border-collapse: collapse; font-size: 12.5px } table.st th { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; text-align: right; padding: 4px 6px; font-weight: 600 }
table.st td { padding: 7px 6px; border-top: 1px solid var(--line); text-align: right; font-family: var(--display); font-weight: 600 } table.st td:first-child, table.st th:first-child { text-align: left; font-family: var(--body) }

.bt { width: 100%; border-collapse: collapse; font-size: 13px }
.bt td { padding: 6px 8px; border-top: 1px solid var(--line) } .bt tr:first-child td { border-top: 0 }
.bt td:first-child { color: var(--muted) } .bt td:last-child { text-align: right; font-weight: 600; font-family: var(--display) }
.bt tr.here td { background: color-mix(in srgb, var(--accent) 16%, transparent) }
.lightset { display: flex; flex-wrap: wrap; gap: 6px }
.light { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 12px; color: var(--faint) }
.light i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--faint); display: inline-block }
.light.on { color: var(--ink); font-weight: 600 } .light.on.b i { background: var(--buy); border-color: var(--buy) } .light.on.s i { background: var(--sell); border-color: var(--sell) }
.list { display: flex; flex-direction: column }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; width: 100% }
.item:first-child { border-top: 0; padding-top: 0 } .item:last-child { padding-bottom: 0 }
.item .body { min-width: 0; flex: 1 } .item .ttl { font-weight: 600 } .item .txt { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere }
.item .time { font-size: 11.5px; color: var(--faint); white-space: nowrap }
.sys { font: 700 10px var(--body); letter-spacing: 0.06em; border-radius: 5px; padding: 2px 6px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); white-space: nowrap }
.sys.q { color: var(--muted); border-color: var(--line) } .sys.st { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { font-weight: 600; font-size: 12.5px; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 12px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.grid-scroll { overflow-x: auto }
table.grid { border-collapse: separate; border-spacing: 4px; width: 100% }
table.grid th { font-size: 11px; font-weight: 600; color: var(--faint); text-align: center; padding: 2px }
table.grid th.rowhead { text-align: left; font: 700 13px var(--display); color: var(--ink); padding-right: 6px }
table.grid td { padding: 0 } table.grid .sq { width: 100%; min-width: 34px; height: 34px; border-radius: 8px; font-size: 12px }
dl { margin: 0; display: grid; gap: 12px } dt { font-weight: 700 } dd { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 65ch }
.note { border: 1px solid color-mix(in srgb, var(--warn) 60%, var(--line)); color: var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 500 }
.foot { color: var(--faint); font-size: 11.5px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; box-shadow: 0 10px 36px rgba(0, 0, 0, .5); animation: rise .35s ease both }
.toast small { display: block; font-weight: 400; opacity: .8 }
.gate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center }
.gate[hidden] { display: none }
.gate div { max-width: 420px; display: grid; gap: 10px } .gate b { font: 700 20px var(--display) }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 transparent } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent) } }
@keyframes beat { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.6); opacity: .5 } }
.lay .dotp.fresh { animation: beat 1.4s ease-in-out infinite }

/* ── phones and narrow windows: the same parts stacked, chart first ── */
@media (max-width: 1023px) {
  html, body { height: auto }
  .app { display: block; height: auto; background: var(--bg) }

  function refreshRemote() {
    loadRemote().then(function (d) {
      if (D && d.made === D.made) { paintStatus(); return; }
      var extra = D ? D.alerts.filter(function (a) { return !d.alerts.some(function (x) { return x.title === a.title && Math.abs(x.t - a.t) < 120; }); }) : [];
      d.alerts = d.alerts.concat(extra).sort(function (a, b) { return a.t - b.t; });
      D = d; norm(); renderAll(); startFeed();
    }).catch(function () { paintStatus(); });
  }

  function start() {
    renderAll(); startFeed(); pollPrices();
    setInterval(pollPrices, 12000);
    setInterval(paintStatus, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { pollPrices(); if (REMOTE) refreshRemote(); } });
    window.addEventListener('resize', function () { document.documentElement.style.setProperty('--topH', $('top').offsetHeight + 'px'); });
    if (window.ResizeObserver) new ResizeObserver(function () { var el = $('lw'); if (lw && el.clientWidth > 0 && el.clientHeight > 0) { try { lw.chart.resize(el.clientWidth, el.clientHeight); } catch (e) {} } }).observe($('lw'));
    if (REMOTE) setInterval(refreshRemote, 150000);
    else if (LOCAL) setTimeout(function () { location.reload(); }, 5 * 60 * 1000);
  }
  if (D) start();
  else if (REMOTE) {
    gate('Opening your desk', 'Loading the latest data.');
    loadRemote().then(function (d) { D = d; norm(); gate(null); start(); }).catch(function (err) {
      gate(err && err.message === 'nokey' ? 'This link is missing its key' : 'Could not open the desk', err && err.message === 'nokey' ? 'Open the full link you were given. It ends with a long code after the # sign.' : 'The data could not be loaded or unlocked. Check the connection, or that the link is complete, then reload.');
    });
  }
})();
</script>
